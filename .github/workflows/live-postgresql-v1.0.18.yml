name: LIVE-02 PostgreSQL Verification v1.0.18

on:
  push:
    branches:
      - modernization/v1.0.18-live-postgresql
    paths:
      - '.ci/v1.0.18/**'
      - '.github/workflows/live-postgresql-v1.0.18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: project0_test
          POSTGRES_USER: project0
          POSTGRES_PASSWORD: project0_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U project0 -d project0_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PROJECT0_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/project0_test
      PROJECT0_TEST_JDBC_USER: project0
      PROJECT0_TEST_JDBC_PASSWORD: project0_test_password

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Record toolchain and database
        run: |
          set -euo pipefail
          java -version 2>&1 | tee live02-java-version.txt
          mvn --version 2>&1 | tee live02-maven-version.txt
          pg_isready -h localhost -p 5432 -U project0 -d project0_test | tee live02-postgresql-readiness.txt

      - name: Reconstruct checksum-verified v1.0.14 baseline payload
        run: |
          set -euo pipefail
          cat \
            .ci/v1.0.14/source.b64.part01 \
            .ci/v1.0.14/source.b64.part02 \
            .ci/v1.0.14/source3.b64.part051 \
            .ci/v1.0.14/source3.b64.part052 \
            .ci/v1.0.14/source2.b64.part06 \
            .ci/v1.0.14/source2.b64.part07 \
            .ci/v1.0.14/source2.b64.part08 \
            > /tmp/project0-source.b64
          test "$(wc -c < /tmp/project0-source.b64)" -eq 61696
          base64 --decode /tmp/project0-source.b64 > /tmp/project0-source.tar.gz
          echo 'b20e349c879c01183da881f3ed675ced50093b298dcdc0f3b4781ffe5289eb46  /tmp/project0-source.tar.gz' | sha256sum --check - | tee live02-payload-sha256.txt
          mkdir -p modern
          tar -xzf /tmp/project0-source.tar.gz -C modern

      - name: Apply remediation lineage through v1.0.17
        run: |
          set -euo pipefail
          python .ci/v1.0.15/apply-v1.0.15.py
          python .ci/v1.0.16/apply-v1.0.16.py
          python .ci/v1.0.17/apply-v1.0.17.py
          grep -q '<version>1.0.17</version>' modern/pom.xml

      - name: Apply v1.0.18 Flyway integration remediation
        run: |
          set -euo pipefail
          python .ci/v1.0.18/apply-v1.0.18.py | tee live02-remediation-v1.0.18.txt
          grep -q '<version>1.0.18</version>' modern/pom.xml
          grep -q 'Flyway.configure()' modern/src/test/java/com/revature/project0/jdbc/JdbcIntegrationTestSupport.java
          ! grep -R 'DatabaseBootstrap.applySchema' modern/src/test/java/com/revature/project0/jdbc

      - name: Maven verify with PostgreSQL
        id: verify
        run: |
          set -o pipefail
          mvn -B -ntp -f modern/pom.xml verify 2>&1 | tee live02-maven-verify.log

      - name: Verify Flyway history
        if: always()
        run: |
          set -euo pipefail
          PGPASSWORD="$PROJECT0_TEST_JDBC_PASSWORD" psql \
            -h localhost -U "$PROJECT0_TEST_JDBC_USER" -d project0_test \
            -Atc "SELECT version || ':' || success FROM flyway_schema_history WHERE type='SQL' ORDER BY installed_rank" \
            | tee live02-flyway-history.txt || true
          PGPASSWORD="$PROJECT0_TEST_JDBC_PASSWORD" psql \
            -h localhost -U "$PROJECT0_TEST_JDBC_USER" -d project0_test \
            -Atc "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name" \
            | tee live02-table-inventory.txt || true

      - name: Summarize LIVE-02 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p live02-evidence
          cp live02-*.txt live02-evidence/ 2>/dev/null || true
          if [ -d modern/target/surefire-reports ]; then cp -R modern/target/surefire-reports live02-evidence/; fi
          if [ -d modern/target/site/jacoco ]; then cp -R modern/target/site/jacoco live02-evidence/jacoco; fi
          find modern/target -maxdepth 1 -type f \( -name '*.jar' -o -name 'bom.*' \) -exec cp {} live02-evidence/ \; 2>/dev/null || true
          {
            echo "commit=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "postgres_image=postgres:18"
            echo "verify_outcome=${{ steps.verify.outcome }}"
          } > live02-evidence/live02-metadata.txt
          find live02-evidence -maxdepth 4 -type f -print | sort > live02-evidence/live02-file-index.txt

      - name: Upload LIVE-02 evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live02-postgresql-verification-v1.0.18
          path: live02-evidence
          if-no-files-found: error
          retention-days: 30
