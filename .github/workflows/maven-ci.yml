name: Maven CI

on:
  push:
    branches:
      - refactor/baseline-and-characterization
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java:
          - '11'
          - '17'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Display tool versions
        run: |
          java -version
          mvn --version

      - name: Prepare CI log directory
        run: mkdir -p target/ci-logs

      - name: Compile production sources
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress clean compile 2>&1 | tee target/ci-logs/compile-java-${{ matrix.java }}.log

      - name: Run characterization tests
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress test 2>&1 | tee target/ci-logs/test-java-${{ matrix.java }}.log

      - name: Verify package lifecycle
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee target/ci-logs/verify-java-${{ matrix.java }}.log

      - name: Publish failure diagnostics to pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Maven CI diagnostics — Java ${{ matrix.java }}"
            echo
            echo '```text'
            if [[ -f target/ci-logs/compile-java-${{ matrix.java }}.log ]]; then
              tail -n 80 target/ci-logs/compile-java-${{ matrix.java }}.log
            elif [[ -f target/ci-logs/test-java-${{ matrix.java }}.log ]]; then
              tail -n 80 target/ci-logs/test-java-${{ matrix.java }}.log
            elif [[ -f target/ci-logs/verify-java-${{ matrix.java }}.log ]]; then
              tail -n 80 target/ci-logs/verify-java-${{ matrix.java }}.log
            else
              echo "No Maven diagnostic log was produced."
            fi
            echo '```'
          } > target/ci-logs/pr-diagnostic-java-${{ matrix.java }}.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file target/ci-logs/pr-diagnostic-java-${{ matrix.java }}.md

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics-java-${{ matrix.java }}
          path: target/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
