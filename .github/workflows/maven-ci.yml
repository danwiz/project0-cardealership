name: Maven CI

on:
  push:
    branches:
      - refactor/baseline-and-characterization
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java:
          - '11'
          - '17'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Display tool versions
        run: |
          java -version
          mvn --version

      - name: Compile production sources
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Run characterization tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Verify package lifecycle
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
