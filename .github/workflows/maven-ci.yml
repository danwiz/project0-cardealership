name: Maven CI

on:
  push:
    branches:
      # Preserve the default-branch push CI gate from master.
      - master
      - refactor/baseline-and-characterization
      - refactor/authentication-remediation
      - refactor/account-repository
      - refactor/credential-hardening
      - refactor/role-authorization
      - refactor/console-authorization-boundary
      - refactor/ownership-payment-records
      - refactor/payment-ledger
      - refactor/inventory-purchase-requests
      - refactor/versioned-persistence
      - refactor/runtime-rehydration
      - refactor/application-context-command-handlers
      - refactor/application-command-services
      - refactor/query-response-models
      - refactor/application-ports-adapters
      - refactor/repository-domain-ports
      - refactor/jdbc-repositories
      - refactor/jdbc-inventory-repository
      - refactor/jdbc-ownership-repository
      - refactor/jdbc-payment-transaction-repository
      - refactor/jdbc-application-composition
      - refactor/configured-console-runtime
      - refactor/application-payment-workflow
      - refactor/ownership-linked-payment-transactions
      - refactor/stable-ownership-identifiers
      - refactor/acquisition-contract-lifecycle
      - refactor/acquisition-lifecycle-query
      - security/role-escalation-regression-20261028
      - security/one-time-jdbc-admin-bootstrap-20261028
      - security/verified-principal-boundary-20261028
      - security/jdbc-credential-and-db-boundary-20261028
      - security/ddl-free-jdbc-runtime-20261028
      - security/read-only-account-views-20261028
      - security/explicit-account-mutation-20261028
      - security/separate-account-administration-20261028
      - security/jdbc-last-admin-guard-20261028
      - security/offline-account-operator-20261028
      - security/postgresql-account-role-validation-20261028
      - security/postgresql-runtime-account-policy-20261028
      - security/postgresql-account-owner-credential-20261028
      - security/trusted-credential-writer-boundary-20261028
      - security/postgresql-credential-audit-trigger-20261028
      - security/credential-request-gate-20261028
      # Run CI for future staged security increments without manual allowlist edits.
      - 'security/**'
      # Documentation/strategy increments receive the same push verification.
      - 'strategy/**'
  pull_request:
    branches:
      - master
      - refactor/baseline-and-characterization
      - refactor/authentication-remediation
      - refactor/account-repository
      - refactor/credential-hardening
      - refactor/role-authorization
      - refactor/console-authorization-boundary
      - refactor/ownership-payment-records
      - refactor/payment-ledger
      - refactor/inventory-purchase-requests
      - refactor/versioned-persistence
      - refactor/runtime-rehydration
      - refactor/application-context-command-handlers
      - refactor/application-command-services
      - refactor/query-response-models
      - refactor/application-ports-adapters
      - refactor/repository-domain-ports
      - refactor/jdbc-repositories
      - refactor/jdbc-inventory-repository
      - refactor/jdbc-ownership-repository
      - refactor/jdbc-payment-transaction-repository
      - refactor/jdbc-application-composition
      - refactor/configured-console-runtime
      - refactor/application-payment-workflow
      - refactor/ownership-linked-payment-transactions
      - refactor/stable-ownership-identifiers
      - refactor/acquisition-contract-lifecycle
      - refactor/acquisition-lifecycle-query
      - security/role-escalation-regression-20261028
      - security/one-time-jdbc-admin-bootstrap-20261028
      - security/verified-principal-boundary-20261028
      - security/jdbc-credential-and-db-boundary-20261028
      - security/ddl-free-jdbc-runtime-20261028
      - security/read-only-account-views-20261028
      - security/explicit-account-mutation-20261028
      - security/separate-account-administration-20261028
      - security/jdbc-last-admin-guard-20261028
      - security/offline-account-operator-20261028
      - security/postgresql-account-role-validation-20261028
      - security/postgresql-runtime-account-policy-20261028
      - security/postgresql-account-owner-credential-20261028
      - security/trusted-credential-writer-boundary-20261028
      - security/postgresql-credential-audit-trigger-20261028
      - 'security/**'
      - 'strategy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealership_ci_owner
          POSTGRES_PASSWORD: ci-only-postgres-fixture
          POSTGRES_DB: dealership_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership_ci_owner -d dealership_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DEALERSHIP_PG_TEST_URL: jdbc:postgresql://localhost:5432/dealership_ci
      DEALERSHIP_PG_TEST_USER: dealership_ci_owner
      DEALERSHIP_PG_TEST_PASSWORD: ci-only-postgres-fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Enable logical decoding in disposable CI PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          pg_container='${{ job.services.postgres.id }}'
          docker exec "$pg_container" psql -U dealership_ci_owner -d dealership_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET wal_level = 'logical'"
          docker restart "$pg_container"
          ready=0
          for attempt in {1..30}; do
            if docker exec "$pg_container" pg_isready -U dealership_ci_owner -d dealership_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          actual=$(docker exec "$pg_container" psql -U dealership_ci_owner -d dealership_ci -At -c 'SHOW wal_level')
          test "$actual" = 'logical'
      - name: Display tool versions
        run: |
          java -version
          mvn --version
      - name: Prepare CI log directory
        run: mkdir -p ci-logs
      - name: Compile production sources
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress clean compile 2>&1 | tee ci-logs/compile-java-${{ matrix.java }}.log
      - name: Run characterization tests
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress test 2>&1 | tee ci-logs/test-java-${{ matrix.java }}.log
      - name: Verify package lifecycle
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress verify 2>&1 | tee ci-logs/verify-java-${{ matrix.java }}.log
      - name: Preserve full-suite XML reports before tag probe
        shell: bash
        run: cp -a target/surefire-reports ci-full-suite-reports

      - name: Verify uppercase SECURITY tag selection is nonempty and exact
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Dgroups=SECURITY \
            -Dtest=UserLoginServiceCharacterizationTest \
            -DfailIfNoTests=true \
            test 2>&1 | tee ci-logs/security-tag-java-${{ matrix.java }}.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path("target/surefire-reports/TEST-com.revature.service.UserLoginServiceCharacterizationTest.xml")
          if not path.is_file():
              raise SystemExit("Missing SECURITY-filtered Surefire XML report")
          suite = ET.parse(path).getroot()
          names = {case.get("name") for case in suite.findall("testcase")}
          expected = {
              "authenticationDoesNotPrintStoredPasswordToStandardOutput",
              "registrationStoresAnEncodedPasswordInsteadOfPlaintext",
          }
          if names != expected:
              raise SystemExit(f"SECURITY selection mismatch: {sorted(names)} != {sorted(expected)}")
          for field, expected_number in (("tests", 2), ("failures", 0), ("errors", 0), ("skipped", 0)):
              if int(suite.get(field, "-1")) != expected_number:
                  raise SystemExit(f"SECURITY {field} check failed: {suite.get(field)}")
          Path("ci-logs/security-tag-verdict.txt").write_text(
              "Uppercase SECURITY filter verified: 2 selected, 0 failures/errors/skips\n"
              + "\n".join(sorted(names)) + "\n", encoding="utf-8"
          )
          print(Path("ci-logs/security-tag-verdict.txt").read_text())
          PY

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maven-diagnostics-java-${{ matrix.java }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-java-${{ matrix.java }}
          # Keep the original 346-test reports, not the two-test filter rerun.
          path: ci-full-suite-reports/
          if-no-files-found: warn
          retention-days: 14

  diagnostics:
    name: Diagnostics for Java ${{ matrix.java }}
    if: always()
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java:
          - '11'
          - '17'

    steps:
      - name: Download Maven diagnostics
        uses: actions/download-artifact@v6
        with:
          name: maven-diagnostics-java-${{ matrix.java }}
          path: diagnostics

      - name: Print relevant Maven diagnostic tail
        shell: bash
        run: |
          echo "Maven diagnostics for Java ${{ matrix.java }}"
          if [[ -f diagnostics/compile-java-${{ matrix.java }}.log ]]; then
            tail -n 60 diagnostics/compile-java-${{ matrix.java }}.log
          elif [[ -f diagnostics/test-java-${{ matrix.java }}.log ]]; then
            tail -n 60 diagnostics/test-java-${{ matrix.java }}.log
          elif [[ -f diagnostics/verify-java-${{ matrix.java }}.log ]]; then
            tail -n 60 diagnostics/verify-java-${{ matrix.java }}.log
          else
            echo "No Maven diagnostic log was found."
            exit 1
          fi
